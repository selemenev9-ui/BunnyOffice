<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BunnyOffice Active</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f; /* Черный фон */
            color: #ffffff;
            font-family: sans-serif;
            margin: 0; padding: 16px;
        }
        .header { margin-bottom: 20px; font-size: 20px; font-weight: bold; }
        
        /* Карточка сделки */
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        
        /* Верхняя часть: Сумма и Профит */
        .top-row {
            display: flex; justify-content: space-between; margin-bottom: 15px;
            border-bottom: 1px solid #333; padding-bottom: 10px;
        }
        .amount { font-size: 18px; font-weight: bold; }
        .profit { color: #4ade80; background: #143020; padding: 4px 8px; border-radius: 6px; font-size: 14px;}

        /* Схема Клиент -> Контрагент */
        .flow { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #bbb; }
        .arrow { color: #555; font-size: 20px; }
        
        /* Кнопка */
        button {
            width: 100%; margin-top: 15px; padding: 10px;
            background: #2a2a2a; border: none; color: white;
            border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">?? В работе: 2 сделки</div>

    <div class="card">
        <div class="top-row">
            <div class="amount">15,000 USDT</div>
            <div class="profit">+120 $</div>
        </div>
        <div class="flow">
            <div>
                <small>Клиент</small><br>
                ?? <b>@vip_client</b>
            </div>
            <div class="arrow">??</div>
            <div style="text-align: right;">
                <small>Контрагент</small><br>
                ?? <b>Сити Обмен</b>
            </div>
        </div>
        <button onclick="alert('Закрываем сделку...')">Завершить</button>
    </div>

    <div class="card">
        <div class="top-row">
            <div class="amount">500,000 RUB</div>
            <div class="profit">+3,500 ??</div>
        </div>
        <div class="flow">
            <div>
                <small>Клиент</small><br>
                ?? <b>Иван (Нал)</b>
            </div>
            <div class="arrow">??</div>
            <div style="text-align: right;">
                <small>Контрагент</small><br>
                ?? <b>Партнер Китай</b>
            </div>
        </div>
        <button onclick="alert('Закрываем сделку...')">Завершить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. Получаем данные из ссылки (URL)
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');

        let deals = [];

        if (dataParam) {
            try {
                // Раскодируем данные, которые прислал бот
                deals = JSON.parse(decodeURIComponent(dataParam));
            } catch (e) {
                console.error("Ошибка чтения данных", e);
                document.body.innerHTML = "<h3 style='color:red'>Ошибка данных</h3>";
            }
        } else {
            // Если открыли просто так, без ссылки от бота
            document.body.innerHTML = "<h3 style='color:#ccc; text-align:center; margin-top:50px'>Нет данных.<br>Откройте через бота!</h3>";
        }

        // 2. Функция отрисовки (почти как была, но адаптирована)
        function renderDeals() {
            const container = document.body; // Или создайте div id="app"
            // Чистим всё, кроме скриптов (простой способ перезаписи)
            const oldContainer = document.getElementById('deals-container');
            if(oldContainer) oldContainer.remove();
            
            const listDiv = document.createElement('div');
            listDiv.id = 'deals-container';
            
            // Заголовок
            const header = document.createElement('h1');
            header.style.color = '#f5f5f5';
            header.style.fontSize = '20px';
            header.innerText = `🔥 Активно: ${deals.length}`;
            listDiv.appendChild(header);

            if (deals.length === 0) {
                listDiv.innerHTML += "<p style='color:#777'>Все сделки закрыты! 🐰</p>";
            }

            deals.forEach(deal => {
                const card = document.createElement('div');
                card.className = 'deal-card'; // Используем стили из прошлого раза
                // Стили должны быть в <style> выше
                card.style = "background-color: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #333;";
                
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px;">
                        <div style="font-size: 18px; font-weight: bold;">${deal.amount}</div>
                        <div style="color: #4ade80; background: #143020; padding: 4px 8px; border-radius: 6px;">+${deal.profit}</div>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #bbb;">
                        <div>
                            <small>Клиент</small><br>👤 <b>${deal.client}</b>
                        </div>
                        <div style="font-size: 20px;">➔</div>
                        <div style="text-align: right;">
                            <small>Контрагент</small><br>🏦 <b>${deal.counterparty}</b>
                        </div>
                    </div>
                    <button onclick="finishDeal(${deal.id})" style="width: 100%; margin-top: 15px; padding: 10px; background: #2a2a2a; border: none; color: white; border-radius: 8px; cursor: pointer;">
                        ✅ Завершить
                    </button>
                `;
                listDiv.appendChild(card);
            });
            
            document.body.appendChild(listDiv);
        }

        // 3. Логика кнопки "Завершить"
        function finishDeal(id) {
            tg.showPopup({
                title: 'Скрыть сделку?',
                message: 'Она пропадет из списка в боте, но останется в таблице.',
                buttons: [{type: 'ok', id: 'yes'}, {type: 'cancel'}]
            }, (btn) => {
                if (btn === 'yes') {
                    // Отправляем боту команду запомнить этот ID как "сделанный"
                    tg.sendData(JSON.stringify({action: 'hide', id: id}));
                }
            });
        }

        // Запуск
        if (deals.length >= 0) renderDeals();
    </script>
</body>
</html>
